<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Relojes V14.1</title>

<style>
:root{
    --bg:#f4f4f4;
    --card:#ffffff;
    --text:#111;
    --accent:#1976d2;
}
body.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#eee;
    --accent:#4dabf7;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    padding:10px;
    background:var(--card);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
}

#grid{
    flex:1;
    display:grid;
    gap:10px;
    padding:10px;
}

@media (orientation:landscape){
    #grid{ grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);}
}
@media (orientation:portrait){
    #grid{ grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(3,1fr);}
}

.clock{
    background:var(--card);
    border-radius:14px;
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
}

.clock-name{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
    cursor:pointer;
}

.timer-layout{
    display:grid;
    grid-template-columns:1fr 180px 1fr;
    align-items:center;
    width:100%;
}

.circle-wrapper{
    width:180px;
    height:180px;
    position:relative;
}

canvas{
    width:180px;
    height:180px;
}

.percent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:26px;
    font-weight:bold;
}

.add-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.display{
    margin-top:15px;
    font-size:24px;
    font-weight:bold;
}

.controls{
    margin-top:12px;
    display:flex;
    gap:14px;
}

button{
    border:none;
    background:var(--accent);
    color:white;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
}

/* MODAL */
#configModal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    width:300px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.modal-box input,
.modal-box select{
    width:100%;
}
</style>
</head>

<body>

<header>
<div id="title"></div>
<div onclick="toggleTheme()" style="cursor:pointer">🌓</div>
</header>

<div id="grid"></div>

<!-- MODAL CONFIG -->
<div id="configModal">
  <div class="modal-box">
    <h3>Configuración</h3>
    <label>Nombre</label>
    <input id="cfgName">

    <label>Tipo</label>
    <select id="cfgType">
      <option value="timer">Timer</option>
      <option value="stopwatch">Cronómetro</option>
    </select>

    <label>Minutos iniciales</label>
    <input type="number" id="cfgMinutes">

    <label>Incrementos (min separados por coma)</label>
    <input id="cfgAdd">

    <label>
      <input type="checkbox" id="cfgSound"> Sonido
    </label>

    <div style="text-align:right;margin-top:10px">
      <button onclick="closeConfig()">Cancelar</button>
      <button onclick="saveConfig()">Guardar</button>
    </div>
  </div>
</div>

<script>

const grid=document.getElementById("grid");
let clocks=[];
let currentIndex=null;

document.getElementById("title").textContent =
"Multi Relojes - "+
new Date().toLocaleDateString("es-AR",
{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});

function createClock(i){
    return{
        name:"Reloj "+(i+1),
        type:"timer",
        totalMs:5*60000,
        remainingMs:5*60000,
        elapsedMs:0,
        endTime:null,
        startTime:null,
        running:false,
        add:[1,3,5],
        sound:true,
        finishedAt:null
    };
}

function init(){
    const saved=localStorage.getItem("multiClocksV141");
    clocks=saved?JSON.parse(saved):Array.from({length:6},(_,i)=>createClock(i));
    render();
    requestAnimationFrame(loop);
}

function render(){
    grid.innerHTML="";
    clocks.forEach((c,i)=>{
        const div=document.createElement("div");
        div.className="clock";

        const name=document.createElement("div");
        name.className="clock-name";
        name.textContent=c.name;
        name.onclick=()=>openConfig(i);
        div.appendChild(name);

        if(c.type==="timer"){
            const layout=document.createElement("div");
            layout.className="timer-layout";

            layout.appendChild(document.createElement("div"));

            const wrapper=document.createElement("div");
            wrapper.className="circle-wrapper";

            const canvas=document.createElement("canvas");
            canvas.width=180;
            canvas.height=180;
            canvas.id="canvas"+i;
            wrapper.appendChild(canvas);

            const percent=document.createElement("div");
            percent.className="percent";
            percent.id="percent"+i;
            wrapper.appendChild(percent);

            layout.appendChild(wrapper);

            const addGroup=document.createElement("div");
            addGroup.className="add-group";
            c.add.forEach(min=>{
                const btn=document.createElement("button");
                btn.textContent="+"+min+"m";
                btn.onclick=()=>addMinutes(i,min);
                addGroup.appendChild(btn);
            });
            layout.appendChild(addGroup);

            div.appendChild(layout);
        }

        const display=document.createElement("div");
        display.className="display";
        display.id="disp"+i;
        div.appendChild(display);

        const controls=document.createElement("div");
        controls.className="controls";

        const play=document.createElement("button");
        play.textContent=c.running?"⏸":"▶";
        play.onclick=()=>toggle(i);
        controls.appendChild(play);

        const stop=document.createElement("button");
        stop.textContent="■";
        stop.onclick=()=>reset(i);
        controls.appendChild(stop);

        div.appendChild(controls);

        grid.appendChild(div);
        draw(i);
    });
}

function openConfig(i){
    currentIndex=i;
    const c=clocks[i];
    document.getElementById("cfgName").value=c.name;
    document.getElementById("cfgType").value=c.type;
    document.getElementById("cfgMinutes").value=Math.floor(c.totalMs/60000);
    document.getElementById("cfgAdd").value=c.add.join(",");
    document.getElementById("cfgSound").checked=c.sound;
    document.getElementById("configModal").style.display="flex";
}

function closeConfig(){
    document.getElementById("configModal").style.display="none";
}

function saveConfig(){
    const c=clocks[currentIndex];
    c.name=document.getElementById("cfgName").value;
    c.type=document.getElementById("cfgType").value;

    const minutes=parseInt(document.getElementById("cfgMinutes").value);
    if(!isNaN(minutes)){
        c.totalMs=minutes*60000;
        c.remainingMs=minutes*60000;
    }

    c.add=document.getElementById("cfgAdd").value
        .split(",")
        .map(n=>parseInt(n.trim()))
        .filter(n=>!isNaN(n));

    c.sound=document.getElementById("cfgSound").checked;

    closeConfig();
    save();
    render();
}

function toggle(i){
    const c=clocks[i];
    if(!c.running){
        if(c.type==="timer"){
            c.endTime=Date.now()+c.remainingMs;
        }else{
            c.startTime=Date.now()-c.elapsedMs;
        }
        c.running=true;
    }else{
        if(c.type==="timer"){
            c.remainingMs=c.endTime-Date.now();
        }else{
            c.elapsedMs=Date.now()-c.startTime;
        }
        c.running=false;
    }
    save();
    render();
}

function reset(i){
    const c=clocks[i];
    c.running=false;
    c.remainingMs=c.totalMs;
    c.elapsedMs=0;
    save();
    render();
}

function addMinutes(i,min){
    const c=clocks[i];
    c.remainingMs+=min*60000;
    if(c.running) c.endTime+=min*60000;
    save();
    render();
}

function loop(){
    clocks.forEach((c,i)=>{
        if(c.running){
            if(c.type==="timer"){
                c.remainingMs=c.endTime-Date.now();
                if(c.remainingMs<=0){
                    c.remainingMs=0;
                    c.running=false;
                    if(c.sound) new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg").play();
                }
            }else{
                c.elapsedMs=Date.now()-c.startTime;
            }
        }

        const disp=document.getElementById("disp"+i);
        if(disp){
            const ms=c.type==="timer"?c.remainingMs:c.elapsedMs;
            disp.textContent=format(ms);
        }

        if(c.type==="timer") draw(i);
    });

    requestAnimationFrame(loop);
}

function draw(i){
    const c=clocks[i];
    const canvas=document.getElementById("canvas"+i);
    if(!canvas) return;

    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,180,180);

    ctx.beginPath();
    ctx.arc(90,90,80,0,2*Math.PI);
    ctx.strokeStyle="#ddd";
    ctx.lineWidth=10;
    ctx.stroke();

    const percent=c.remainingMs/c.totalMs;
    ctx.beginPath();
    ctx.arc(90,90,80,-Math.PI/2,(-Math.PI/2)+(2*Math.PI*percent));
    ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue("--accent");
    ctx.lineWidth=10;
    ctx.stroke();

    const p=document.getElementById("percent"+i);
    if(p) p.textContent=Math.floor(percent*100)+"%";
}

function format(ms){
    const s=Math.floor(ms/1000)%60;
    const m=Math.floor(ms/60000)%60;
    const h=Math.floor(ms/3600000);
    return [h,m,s].map(n=>n.toString().padStart(2,"0")).join(":");
}

function save(){
    localStorage.setItem("multiClocksV141",JSON.stringify(clocks));
}

function toggleTheme(){
    document.body.classList.toggle("dark");
    localStorage.setItem("theme",
        document.body.classList.contains("dark")?"dark":"light");
}

init();
</script>
</body>
</html>
