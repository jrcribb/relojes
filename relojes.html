<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Multi Relojes</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="clock-core.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header>
      <div>
        <h1>Multi Relojes</h1>
        <span id="date"></span>
      </div>
      <button id="theme" aria-label="Cambiar tema">Tema oscuro</button>
    </header>
    <main id="grid" aria-label="Seis relojes"></main>
    <p id="notice" role="status" hidden></p>
    <dialog id="config">
      <form id="configForm" novalidate>
        <div class="dialog-heading">
          <h2>Configurar reloj</h2>
          <button type="button" id="close" aria-label="Cerrar configuración">
            ✕
          </button>
        </div>
        <label class="field"
          >Nombre<input id="cfgName" maxlength="40" required
        /></label>
        <label class="field"
          >Tipo<select id="cfgType">
            <option value="timer">Temporizador</option>
            <option value="stopwatch">Cronómetro</option>
          </select></label
        >
        <label class="field">Grupo por color
          <select id="cfgGroup" aria-describedby="groupHelp">
            <option value="none">Sin grupo</option>
            <option value="blue">Azul</option>
            <option value="purple">Violeta</option>
            <option value="green">Verde</option>
            <option value="orange">Naranja</option>
            <option value="pink">Rosa</option>
            <option value="teal">Turquesa</option>
          </select>
        </label>
        <label class="field timer-field"
          >Minutos iniciales<input
            id="cfgMinutes"
            type="number"
            min="1"
            max="5999"
            step="1"
            inputmode="numeric"
            required
        /></label>
        <label class="field timer-field"
          >Incrementos en minutos<input
            id="cfgAdd"
            placeholder="1, 3, 5"
            aria-describedby="addHelp"
          /><small id="addHelp"
            >De 1 a 3 enteros, separados por coma.</small
          ></label
        >
        <label class="field timer-field"
          >Alarma<select id="cfgSound">
            <option value="off">Sin sonido</option>
            <option value="short">Corta · 1 beep</option>
            <option value="long">Larga · 3 beeps</option>
          </select></label
        >
        <button class="timer-field" type="button" id="testSound">
          Probar sonido
        </button>
        <p id="configHint">
          Cambiar duración o tipo reinicia el reloj en pausa.
        </p>
        <p id="groupHelp">Al iniciar uno, se pausan los demás del mismo color.</p>
        <p id="error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" id="cancel">Cancelar</button
          ><button type="submit" class="primary">Guardar</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
